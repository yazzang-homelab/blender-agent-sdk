[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "blender-agent-sdk"
version = "0.2.0"
description = "Drive Blender from AI agents through a plain Python SDK (with an optional MCP server), backed by a reverse-engineered map of Blender 5.2"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "yazzang-homelab" }]
keywords = ["blender", "bpy", "agent", "llm", "computer-use", "function-calling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = []

[project.scripts]
blender-agent = "blender_agent.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "mcp>=1.9"]  # mcp: the official client, to test interoperability
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]

[project.urls]
Repository = "https://github.com/yazzang-homelab/blender-agent-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
