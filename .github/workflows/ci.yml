name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BLENDER_VERSION: "5.2.2"
      BLENDER_SERIES: "5.2"
      # Hosted runners have no GPU: pin screenshots to Cycles on the CPU.
      BLENDER_AGENT_RENDER_ENGINE: CYCLES
      # Official checksum: https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
      BLENDER_SHA256: "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168"
      # The GUI test must run here, never skip.
      BLENDER_AGENT_REQUIRE_GUI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries for Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 \
            libxkbcommon-x11-0 libsm6 libice6 libwayland-client0 libdecor-0-0

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64-${{ env.BLENDER_SHA256 }}

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          tarball="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -sfLo "$RUNNER_TEMP/$tarball" "https://download.blender.org/release/Blender${BLENDER_SERIES}/$tarball"
          echo "${BLENDER_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p ~/blender
          tar -xJf "$RUNNER_TEMP/$tarball" -C ~/blender --strip-components=1

      - name: Install package
        run: pip install -e ".[test]"

      - name: Tests (background + GUI under Xvfb)
        run: |
          export BLENDER=~/blender/blender
          "$BLENDER" --version | head -1
          xvfb-run -a -s "-screen 0 1280x1024x24" pytest -v
