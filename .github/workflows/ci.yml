name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: blender-5.2.2-linux-x64.tar.xz
            sha256: 84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168
          - os: windows-2022
            asset: blender-5.2.2-windows-x64.zip
            sha256: 3849d17a682cba006075aaa3f3597ecb5c9c30ec31035b2e092c53e40679b535
          - os: macos-14
            asset: blender-5.2.2-macos-arm64.dmg
            sha256: dc4125399b8bfefe283cc1624d6cfc7809d1cac20ace51072127eb371f31f210
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      # Official checksums: https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
      BLENDER_URL: https://download.blender.org/release/Blender5.2/${{ matrix.asset }}
      # Hosted runners have no usable GPU: pin screenshots to Cycles on the CPU.
      BLENDER_AGENT_RENDER_ENGINE: CYCLES
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries for Blender
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 \
            libxkbcommon-x11-0 libsm6 libice6 libwayland-client0 libdecor-0-0

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ matrix.asset }}-${{ matrix.sha256 }}

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/${{ matrix.asset }}"
          curl -sfLo "$archive" "$BLENDER_URL"
          python -c "import hashlib,sys; d=hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest(); sys.exit(d != sys.argv[2] and f'sha256 mismatch: {d}')" "$archive" "${{ matrix.sha256 }}"
          mkdir -p ~/blender
          case "${{ runner.os }}" in
            Linux)   tar -xJf "$archive" -C ~/blender --strip-components=1 ;;
            Windows) 7z x -bd -o"$RUNNER_TEMP/b" "$archive" > /dev/null && mv "$RUNNER_TEMP"/b/blender-*/* ~/blender/ ;;
            macOS)   hdiutil attach "$archive" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
                     cp -R "$RUNNER_TEMP/dmg/Blender.app" ~/blender/
                     hdiutil detach "$RUNNER_TEMP/dmg" ;;
          esac

      - name: Locate Blender
        run: |
          case "${{ runner.os }}" in
            Linux)   echo "BLENDER=$HOME/blender/blender" >> "$GITHUB_ENV" ;;
            Windows) echo "BLENDER=$(cygpath -w "$HOME/blender/blender.exe")" >> "$GITHUB_ENV" ;;
            macOS)   echo "BLENDER=$HOME/blender/Blender.app/Contents/MacOS/Blender" >> "$GITHUB_ENV" ;;
          esac

      - name: Install package
        run: pip install -e ".[test]"

      - name: Tests (background; GUI under Xvfb on Linux)
        run: |
          "$BLENDER" --version | head -1
          python -c "import socket; print('transport:', 'unix' if hasattr(socket, 'AF_UNIX') else 'tcp+token')"
          if [ "${{ runner.os }}" = Linux ]; then
            # The GUI test must run here, never skip.
            BLENDER_AGENT_REQUIRE_GUI=1 xvfb-run -a -s "-screen 0 1280x1024x24" pytest -v
          else
            # No display server for an OpenGL Blender window on these runners: the GUI test skips.
            pytest -v
          fi
